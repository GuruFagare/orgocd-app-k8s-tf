apiVersion: apps/v1
kind: Deployment
metadata:
  name: appscrip-deployment
  namespace: default
  labels:
    app: appscrip
spec:
  replicas: 3
  selector:
    matchLabels:
      app: appscrip
  template:
    metadata:
      labels:
        app: appscrip
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
