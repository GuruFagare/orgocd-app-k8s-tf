apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appscrip-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # TODO: replace with the HTTPS URL of YOUR own Git repo where this project lives
    repoURL: https://github.com/<your-username>/<your-repo>.git
    targetRevision: HEAD
    # Path inside the repo that holds the Kubernetes manifests
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
